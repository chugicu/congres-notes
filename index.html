<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CongrèsNotes">
<title>CongrèsNotes</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root {
    --ink:#1a1a2e; --ink2:#16213e; --accent:#e94560; --accent2:#f5a623;
    --surface:#fff; --surface2:#f8f7f4; --surface3:#eeecea;
    --border:#e0ddd8; --text:#2d2d2d; --text2:#6b6b6b;
    --success:#27ae60; --radius:16px; --shadow:0 4px 24px rgba(26,26,46,0.10);
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { font-family:'DM Sans',sans-serif; background:var(--surface2); color:var(--text); min-height:100vh; padding-bottom:40px; }

  /* ── Écran identification ── */
  .id-screen { position:fixed; inset:0; background:var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px; z-index:100; }
  .id-screen.hidden { display:none; }
  .id-logo { font-family:'DM Serif Display',serif; font-size:36px; color:white; margin-bottom:8px; }
  .id-logo span { color:var(--accent); }
  .id-sub { color:rgba(255,255,255,0.5); font-size:14px; margin-bottom:40px; }
  .id-label { color:rgba(255,255,255,0.7); font-size:13px; font-weight:500; align-self:flex-start; margin-bottom:8px; width:100%; max-width:320px; }
  .id-input { width:100%; max-width:320px; padding:16px; border:1.5px solid rgba(255,255,255,0.15); border-radius:12px; background:rgba(255,255,255,0.08); color:white; font-family:'DM Sans',sans-serif; font-size:18px; outline:none; margin-bottom:16px; }
  .id-input::placeholder { color:rgba(255,255,255,0.3); }
  .id-btn { width:100%; max-width:320px; padding:16px; background:var(--accent); color:white; border:none; border-radius:12px; font-family:'DM Sans',sans-serif; font-size:16px; font-weight:600; cursor:pointer; }
  .id-existing { margin-top:24px; width:100%; max-width:320px; }
  .id-existing-title { color:rgba(255,255,255,0.4); font-size:12px; text-align:center; margin-bottom:10px; }
  .id-user-chip { display:inline-block; margin:4px; padding:8px 16px; background:rgba(255,255,255,0.1); color:white; border-radius:20px; font-size:14px; cursor:pointer; border:1.5px solid rgba(255,255,255,0.15); }

  /* ── Header ── */
  .header { background:var(--ink); color:white; padding:52px 20px 20px; position:relative; overflow:hidden; }
  .header::before { content:''; position:absolute; top:-40px; right:-40px; width:180px; height:180px; border-radius:50%; background:rgba(233,69,96,0.15); }
  .header-top { display:flex; align-items:flex-start; justify-content:space-between; position:relative; z-index:1; }
  .header-title { font-family:'DM Serif Display',serif; font-size:26px; letter-spacing:-0.5px; }
  .header-title span { color:var(--accent); }
  .header-date { font-size:12px; color:rgba(255,255,255,0.5); margin-top:3px; font-weight:300; }
  .user-badge { display:flex; align-items:center; gap:6px; background:rgba(255,255,255,0.1); border-radius:20px; padding:6px 12px; cursor:pointer; flex-shrink:0; }
  .user-avatar { width:26px; height:26px; border-radius:50%; background:var(--accent); color:white; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .user-name { color:white; font-size:13px; font-weight:500; max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ── Session bar ── */
  .session-bar { background:var(--ink2); padding:12px 20px; display:flex; align-items:center; gap:10px; }
  .session-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); flex-shrink:0; animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.8)} }
  .session-input { background:transparent; border:none; color:white; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; flex:1; outline:none; }
  .session-input::placeholder { color:rgba(255,255,255,0.35); font-weight:300; }

  .main { padding:20px; display:flex; flex-direction:column; gap:16px; }

  /* ── Card ── */
  .card { background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
  .card-header { padding:14px 18px 10px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; }
  .card-icon { font-size:16px; }
  .card-title { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:var(--text2); }
  .card-body { padding:16px 18px; }

  .note-area { width:100%; min-height:120px; border:none; outline:none; font-family:'DM Sans',sans-serif; font-size:16px; line-height:1.6; color:var(--text); resize:none; background:transparent; }
  .note-area::placeholder { color:#bbb; font-weight:300; }

  /* ── Boutons ── */
  .actions { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .btn { border:none; border-radius:12px; padding:16px 12px; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; transition:transform .15s,opacity .15s; -webkit-user-select:none; }
  .btn:active { transform:scale(.96); opacity:.85; }
  .btn-icon { font-size:24px; }
  .btn-dictate { background:var(--accent); color:white; grid-column:1/-1; flex-direction:row; justify-content:center; padding:18px; font-size:16px; border-radius:14px; }
  .btn-dictate.recording { background:#c0392b; animation:recordPulse 1s infinite; }
  @keyframes recordPulse { 0%,100%{box-shadow:0 0 0 0 rgba(233,69,96,.4)} 50%{box-shadow:0 0 0 10px rgba(233,69,96,0)} }
  .btn-photo { background:var(--surface2); color:var(--text); border:1.5px solid var(--border); }
  .btn-save { background:var(--ink); color:white; }
  .btn-save:disabled { opacity:.4; }

  /* ── Photos ── */
  .photos-grid { display:none; margin-top:12px; flex-direction:column; gap:10px; }
  .photos-grid.has-photos { display:flex; }
  .photo-item { border:1.5px solid var(--border); border-radius:12px; overflow:hidden; background:var(--surface3); }
  .photo-item-top { position:relative; }
  .photo-item-top img { width:100%; max-height:160px; object-fit:cover; display:block; }
  .photo-item-badge { position:absolute; top:8px; left:8px; background:rgba(26,26,46,.75); color:white; font-size:11px; font-weight:600; padding:3px 8px; border-radius:20px; }
  .photo-remove { position:absolute; top:8px; right:8px; background:rgba(0,0,0,.6); color:white; border:none; border-radius:50%; width:28px; height:28px; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .photo-caption { width:100%; border:none; border-top:1px solid var(--border); padding:10px 12px; font-family:'DM Sans',sans-serif; font-size:14px; color:var(--text); outline:none; background:transparent; }
  .photo-caption::placeholder { color:#bbb; }
  .photo-ocr-bar { display:flex; gap:6px; padding:8px 10px; border-top:1px solid var(--border); background:var(--surface2); }
  .btn-ocr { flex:1; border:none; border-radius:8px; padding:8px 6px; font-family:'DM Sans',sans-serif; font-size:12px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:4px; }
  .btn-ocr-fast { background:var(--surface3); color:var(--text); border:1.5px solid var(--border); }
  .btn-ocr-precise { background:var(--ink); color:white; }
  .btn-ocr:disabled { opacity:.4; cursor:wait; }
  .ocr-result { padding:8px 12px; font-size:12px; color:var(--text2); background:#fffbf0; border-top:1px solid #f5e6a3; line-height:1.5; display:none; }
  .ocr-result.visible { display:block; }
  .ocr-inject-btn { display:inline-block; margin-top:6px; padding:4px 12px; background:var(--accent); color:white; border:none; border-radius:20px; font-family:'DM Sans',sans-serif; font-size:12px; font-weight:600; cursor:pointer; }

  /* ── Notes ── */
  .notes-list { display:flex; flex-direction:column; }
  .note-item { padding:14px 18px; border-bottom:1px solid var(--border); }
  .note-item:last-child { border-bottom:none; }
  .note-meta { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .note-time { font-size:11px; font-weight:600; color:var(--accent); text-transform:uppercase; letter-spacing:.5px; }
  .note-session { font-size:11px; color:var(--text2); background:var(--surface3); padding:2px 8px; border-radius:20px; max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .note-text { font-size:14px; line-height:1.5; color:var(--text); }
  .empty-state { padding:32px 18px; text-align:center; color:var(--text2); font-size:14px; }
  .empty-icon { font-size:32px; margin-bottom:8px; }

  /* ── Participants ── */
  .users-today { background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px 18px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .users-today-label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:var(--text2); width:100%; }
  .user-chip { display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:20px; font-size:13px; font-weight:500; }
  .user-chip-avatar { width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:white; flex-shrink:0; }

  .btn-report { background:linear-gradient(135deg,var(--accent2),#e67e22); color:white; width:100%; border:none; border-radius:14px; padding:18px; font-family:'DM Sans',sans-serif; font-size:15px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; }
  .btn-report:active { transform:scale(.97); }

  .admin-link { text-align:center; padding:12px; font-size:12px; color:var(--text2); }
  .admin-link a { color:var(--text2); text-decoration:underline; }

  .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--ink); color:white; padding:12px 24px; border-radius:100px; font-size:14px; font-weight:500; transition:transform .3s cubic-bezier(.34,1.56,.64,1); z-index:1000; white-space:nowrap; box-shadow:0 8px 32px rgba(0,0,0,.25); }
  .toast.show { transform:translateX(-50%) translateY(0); }
  .toast.success { background:var(--success); }
  .toast.error { background:var(--accent); }

  .spinner { display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,.3); border-top-color:white; border-radius:50%; animation:spin .8s linear infinite; vertical-align:middle; }
  @keyframes spin { to{transform:rotate(360deg)} }
  #photoInput { display:none; }
</style>
</head>
<body>

<!-- Écran identification -->
<div class="id-screen hidden" id="idScreen">
  <div class="id-logo">Congrès<span>Notes</span></div>
  <div class="id-sub">Identifiez-vous pour commencer</div>
  <div class="id-label">Votre prénom et nom</div>
  <input class="id-input" id="nameInput" type="text" placeholder="Ex : Marie Dupont" autocomplete="off" autocorrect="off">
  <button class="id-btn" id="identityBtn">Commencer →</button>
  <div class="id-existing" id="existingUsers"></div>
</div>

<!-- Header -->
<div class="header">
  <div class="header-top">
    <div>
      <div class="header-title">Congrès<span>Notes</span></div>
      <div class="header-date" id="headerDate"></div>
    </div>
    <div class="user-badge" id="userBadge">
      <div class="user-avatar" id="userAvatar">?</div>
      <div class="user-name" id="userName">—</div>
    </div>
  </div>
</div>

<div class="session-bar">
  <div class="session-dot"></div>
  <input class="session-input" id="sessionInput" type="text" placeholder="Nom de la session en cours..." autocomplete="off">
</div>

<div class="main">
  <div class="card">
    <div class="card-header"><span class="card-icon">✏️</span><span class="card-title">Nouvelle note</span></div>
    <div class="card-body">
      <textarea class="note-area" id="noteText" placeholder="Dictez ou tapez vos notes ici..."></textarea>
      <div class="photos-grid" id="photosGrid"></div>
      <div class="actions" style="margin-top:16px;">
        <button class="btn btn-dictate" id="dictateBtn">
          <span class="btn-icon">🎙️</span><span id="dictateLabel">Dicter</span>
        </button>
        <button class="btn btn-photo" id="photoBtn">
          <span class="btn-icon">📷</span><span id="photoLabel">Photo</span>
        </button>
        <button class="btn btn-save" id="saveBtn">
          <span class="btn-icon">💾</span>Enregistrer
        </button>
      </div>
      <input type="file" id="photoInput" accept="image/*" capture="environment">
    </div>
  </div>

  <button class="btn-report" id="reportBtn">✨ Mon rapport Claude</button>

  <div class="users-today" id="usersToday">
    <div class="users-today-label">👥 Participants aujourd'hui</div>
    <div style="font-size:13px;color:var(--text2);">Chargement...</div>
  </div>

  <div class="card">
    <div class="card-header">
      <span class="card-icon">📋</span>
      <span class="card-title">Mes notes du jour</span>
      <span id="noteCount" style="margin-left:auto;font-size:12px;color:var(--text2);"></span>
    </div>
    <div class="notes-list" id="notesList">
      <div class="empty-state"><div class="empty-icon">🗒️</div>Aucune note pour l'instant</div>
    </div>
  </div>

  <div class="admin-link"><a href="admin.html">Page admin →</a></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── CONFIG — collez votre URL Apps Script ici ──────────────────────
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbycDC1_oOgwUb5pq-6UWXRjdzXZmAqmQWnQh_hGUmS0FyZmYeSMqzjhm3syhSbqBjMd0g/exec';
// ──────────────────────────────────────────────────────────────────

const USER_COLORS = ['#e94560','#3498db','#27ae60','#9b59b6','#f39c12','#1abc9c','#e67e22','#e74c3c'];
function colorForUser(n) { let h=0; for(let c of n) h=c.charCodeAt(0)+((h<<5)-h); return USER_COLORS[Math.abs(h)%USER_COLORS.length]; }
function initials(n) { return n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2); }

let recognition=null, isRecording=false, currentPhotos=[], todayNotes=[], currentUser=null;

// ── API via JSONP (contourne les CORS) ────────────────────────────
function api(params) {
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Math.random().toString(36).slice(2);
    const timeout = setTimeout(() => {
      delete window[cbName];
      document.getElementById(cbName)?.remove();
      reject(new Error('Timeout'));
    }, 30000);
    window[cbName] = (data) => {
      clearTimeout(timeout);
      delete window[cbName];
      document.getElementById(cbName)?.remove();
      resolve(data);
    };
    params.callback = cbName;
    const url = SCRIPT_URL + '?' + new URLSearchParams(params);
    const script = document.createElement('script');
    script.id = cbName;
    script.src = url;
    script.onerror = () => {
      clearTimeout(timeout);
      delete window[cbName];
      script.remove();
      reject(new Error('Erreur réseau'));
    };
    document.head.appendChild(script);
  });
}

// ── Init ───────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('headerDate').textContent =
    new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

  const saved = localStorage.getItem('congresNotesUser');
  if (saved) { currentUser = saved; showApp(); }
  else showIdScreen();

  document.getElementById('identityBtn').addEventListener('click', confirmIdentity);
  document.getElementById('nameInput').addEventListener('keydown', e => { if(e.key==='Enter') confirmIdentity(); });
  document.getElementById('userBadge').addEventListener('click', changeUser);
  document.getElementById('dictateBtn').addEventListener('click', toggleDictation);
  document.getElementById('photoBtn').addEventListener('click', () => document.getElementById('photoInput').click());
  document.getElementById('photoInput').addEventListener('change', handlePhoto);
  document.getElementById('saveBtn').addEventListener('click', saveNote);
  document.getElementById('reportBtn').addEventListener('click', prepareMyReport);
  document.getElementById('sessionInput').addEventListener('input', e => localStorage.setItem('congresNotesSession', e.target.value));
  const ss = localStorage.getItem('congresNotesSession');
  if (ss) document.getElementById('sessionInput').value = ss;
});

// ── Identification ─────────────────────────────────────────────────
async function showIdScreen() {
  document.getElementById('idScreen').classList.remove('hidden');
  try {
    const res = await api({ action: 'getKnownUsers' });
    const users = res.users || [];
    if (!users.length) return;
    const div = document.getElementById('existingUsers');
    div.innerHTML = '<div class="id-existing-title">Ou choisissez votre nom</div>' +
      users.map(u => `<span class="id-user-chip" data-name="${u}">${u}</span>`).join('');
    div.querySelectorAll('.id-user-chip').forEach(c =>
      c.addEventListener('click', () => selectUser(c.dataset.name)));
  } catch(e) {}
}

function selectUser(name) {
  currentUser = name;
  localStorage.setItem('congresNotesUser', name);
  document.getElementById('idScreen').classList.add('hidden');
  showApp();
}

function confirmIdentity() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name || name.length < 2) { showToast('Entrez votre prénom et nom', 'error'); return; }
  selectUser(name);
}

function changeUser() {
  if (!confirm('Changer d\'utilisateur ?')) return;
  localStorage.removeItem('congresNotesUser');
  currentUser = null;
  showIdScreen();
}

function showApp() {
  const color = colorForUser(currentUser);
  document.getElementById('userAvatar').textContent = initials(currentUser);
  document.getElementById('userAvatar').style.background = color;
  document.getElementById('userName').textContent = currentUser.split(' ')[0];
  loadTodayNotes();
  loadTodayUsers();
}

// ── Participants ───────────────────────────────────────────────────
async function loadTodayUsers() {
  try {
    const res = await api({ action: 'getTodayUsers' });
    const users = res.users || [];
    const div = document.getElementById('usersToday');
    if (!users.length) {
      div.innerHTML = '<div class="users-today-label">👥 Participants aujourd\'hui</div><div style="font-size:13px;color:var(--text2);">Aucun participant</div>';
      return;
    }
    div.innerHTML = '<div class="users-today-label">👥 Participants aujourd\'hui</div>' +
      users.map(u => `<div class="user-chip"><div class="user-chip-avatar" style="background:${colorForUser(u)}">${initials(u)}</div>${u}</div>`).join('');
  } catch(e) {}
}

// ── Dictée ─────────────────────────────────────────────────────────
function toggleDictation() { isRecording ? stopDictation() : startDictation(); }

function startDictation() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showToast('Dictée non disponible — utilisez Safari', 'error'); return; }
  recognition = new SR();
  recognition.lang = 'fr-FR'; recognition.continuous = true; recognition.interimResults = true;
  const ta = document.getElementById('noteText');
  const base = ta.value;
  let interim = '';
  recognition.onresult = ev => {
    let fin='', tmp='';
    for (let i=ev.resultIndex; i<ev.results.length; i++) {
      const t = ev.results[i][0].transcript;
      ev.results[i].isFinal ? fin += t+' ' : tmp += t;
    }
    if (fin) interim += fin;
    ta.value = base + (base?'\n':'') + interim + tmp;
  };
  recognition.onerror = e => { if(e.error!=='aborted') showToast('Erreur : '+e.error,'error'); stopDictation(); };
  recognition.onend = () => { if(isRecording) recognition.start(); };
  recognition.start();
  isRecording = true;
  document.getElementById('dictateBtn').classList.add('recording');
  document.getElementById('dictateLabel').textContent = 'Arrêter';
}

function stopDictation() {
  if (recognition) { recognition.onend=null; recognition.stop(); recognition=null; }
  isRecording = false;
  document.getElementById('dictateBtn').classList.remove('recording');
  document.getElementById('dictateLabel').textContent = 'Dicter';
}

// ── Photos ─────────────────────────────────────────────────────────
function handlePhoto(ev) {
  const file = ev.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = e => { currentPhotos.push({base64:e.target.result,caption:''}); renderPhotos(); document.getElementById('photoInput').value=''; updatePhotoBtn(); };
  r.readAsDataURL(file);
}

function renderPhotos() {
  const grid = document.getElementById('photosGrid');
  if (!currentPhotos.length) { grid.classList.remove('has-photos'); grid.innerHTML=''; return; }
  grid.classList.add('has-photos');
  grid.innerHTML = currentPhotos.map((p,i) => `
    <div class="photo-item">
      <div class="photo-item-top">
        <img src="${p.base64}" alt="photo ${i+1}">
        <span class="photo-item-badge">📷 ${i+1}</span>
        <button class="photo-remove" data-i="${i}">✕</button>
      </div>
      <input class="photo-caption" type="text" placeholder="Légende photo ${i+1}..." value="${p.caption}" data-i="${i}">
      <div class="photo-ocr-bar">
        <button class="btn-ocr btn-ocr-fast" data-i="${i}" data-mode="fast">⚡ Extraire le texte</button>
      </div>
      <div class="ocr-result" id="ocr-${i}"></div>
    </div>`).join('');
  grid.querySelectorAll('.photo-remove').forEach(b => b.addEventListener('click', () => { currentPhotos.splice(+b.dataset.i,1); renderPhotos(); updatePhotoBtn(); }));
  grid.querySelectorAll('.photo-caption').forEach(inp => inp.addEventListener('input', () => { currentPhotos[+inp.dataset.i].caption = inp.value; }));
  grid.querySelectorAll('.btn-ocr').forEach(b => b.addEventListener('click', () => runOCR(+b.dataset.i, b.dataset.mode)));
}

function updatePhotoBtn() { document.getElementById('photoLabel').textContent = currentPhotos.length ? `Photo (${currentPhotos.length})` : 'Photo'; }
function resetPhotos() { currentPhotos=[]; renderPhotos(); updatePhotoBtn(); }

// ── OCR ────────────────────────────────────────────────────────────
async function runOCR(i, mode) {
  const photo = currentPhotos[i]; if(!photo) return;
  const rd = document.getElementById('ocr-'+i);
  const btns = document.querySelectorAll(`.btn-ocr[data-i="${i}"]`);
  btns.forEach(b=>b.disabled=true);
  rd.className='ocr-result visible';
  rd.innerHTML='<span class="spinner" style="border-color:rgba(0,0,0,.2);border-top-color:#333"></span> Extraction...';

  if (mode==='fast') {
    try {
      const w = await Tesseract.createWorker('fra+eng',1,{
        logger: m => { if(m.status==='recognizing text') rd.innerHTML=`<span class="spinner" style="border-color:rgba(0,0,0,.2);border-top-color:#333"></span> ${Math.round(m.progress*100)}%`; }
      });
      const {data:{text}} = await w.recognize(photo.base64);
      await w.terminate();
      showOCRResult(i, text.trim(), rd, btns, 'Tesseract');
    } catch(e) { rd.innerHTML='❌ '+e.message; btns.forEach(b=>b.disabled=false); }
  } else {
    try {
      const res = await api({ action:'extractOCR', base64: encodeURIComponent(photo.base64) });
      if (res.success) showOCRResult(i, res.text.trim(), rd, btns, 'Google');
      else { rd.innerHTML='❌ '+(res.error||'Erreur'); btns.forEach(b=>b.disabled=false); }
    } catch(e) { rd.innerHTML='❌ '+e.message; btns.forEach(b=>b.disabled=false); }
  }
}

function showOCRResult(i, text, rd, btns, source) {
  btns.forEach(b=>b.disabled=false);
  if (!text) { rd.innerHTML='⚠️ Aucun texte détecté.'; return; }
  const esc = text.replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const btn = document.createElement('button');
  btn.className='ocr-inject-btn'; btn.textContent='➕ Injecter dans la note';
  btn.addEventListener('click', () => {
    const ta=document.getElementById('noteText');
    ta.value = (ta.value.trim()||'') + (ta.value.trim()?'\n\n':'') + `📷 Texte extrait photo ${i+1} :\n${text}`;
    showToast('✅ Texte injecté !','success');
  });
  rd.innerHTML=`<div style="font-size:11px;color:var(--text2);margin-bottom:4px;">Texte extrait (${source}) :</div><div style="white-space:pre-wrap;font-size:13px;">${esc}</div>`;
  rd.appendChild(btn);
}

// ── Sauvegarde ─────────────────────────────────────────────────────
async function saveNote() {
  if (!currentUser) { showToast('Identifiez-vous d\'abord','error'); return; }
  const text = document.getElementById('noteText').value.trim();
  if (!text) { showToast('Écrivez ou dictez une note d\'abord','error'); return; }
  if (isRecording) stopDictation();

  const btn = document.getElementById('saveBtn');
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span>';

  const session = document.getElementById('sessionInput').value.trim() || 'Session sans titre';
  const time = new Date().toTimeString().slice(0,5);
  const data = { time, session, text, user:currentUser, photos:currentPhotos.map(p=>({base64:p.base64,caption:p.caption||''})) };

  try {
    const res = await api({ action:'saveNote', data: encodeURIComponent(JSON.stringify(data)) });
    btn.disabled=false; btn.innerHTML='<span class="btn-icon">💾</span> Enregistrer';
    if (res.success) {
      const pc = currentPhotos.length;
      showToast('✅ Note sauvegardée'+(pc?` + ${pc} photo(s)`:'')+' !','success');
      todayNotes.unshift({time,session,text,photoCount:pc,photoCaptions:currentPhotos.map(p=>p.caption).filter(Boolean)});
      renderNotes();
      document.getElementById('noteText').value='';
      resetPhotos();
      loadTodayUsers();
    } else showToast('Erreur : '+(res.error||'inconnue'),'error');
  } catch(e) {
    btn.disabled=false; btn.innerHTML='<span class="btn-icon">💾</span> Enregistrer';
    showToast('Erreur de connexion','error');
    console.error(e);
  }
}

// ── Notes ──────────────────────────────────────────────────────────
async function loadTodayNotes() {
  if (!currentUser) return;
  try {
    const res = await api({ action:'getTodayNotes', user:currentUser });
    todayNotes = res.notes || [];
    renderNotes();
  } catch(e) {}
}

function renderNotes() {
  const list = document.getElementById('notesList');
  const count = document.getElementById('noteCount');
  count.textContent = todayNotes.length+' note'+(todayNotes.length>1?'s':'');
  if (!todayNotes.length) { list.innerHTML='<div class="empty-state"><div class="empty-icon">🗒️</div>Aucune note pour l\'instant</div>'; return; }
  list.innerHTML = todayNotes.map(n => `
    <div class="note-item">
      <div class="note-meta"><span class="note-time">${n.time}</span><span class="note-session">${n.session}</span></div>
      <div class="note-text">${n.text}</div>
      ${n.photoCount>0?`<div style="font-size:12px;color:var(--text2);margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;">
        ${(n.photoCaptions||[]).map((c,i)=>`<span style="background:var(--surface3);padding:2px 8px;border-radius:20px;">📷${i+1} ${c||'sans légende'}</span>`).join('')}
        ${!n.photoCaptions?.length?`<span style="background:var(--surface3);padding:2px 8px;border-radius:20px;">📷 ${n.photoCount} photo(s)</span>`:''}
      </div>`:''}
    </div>`).join('');
}

// ── Rapport ────────────────────────────────────────────────────────
async function prepareMyReport() {
  if (!currentUser) { showToast('Identifiez-vous d\'abord','error'); return; }
  showToast('Préparation du rapport...');
  try {
    const res = await api({ action:'prepareReport', user:currentUser });
    if (res.success) { window.open(res.url,'_blank'); showToast('✅ Rapport prêt !','success'); }
    else showToast('Erreur : '+(res.error||'inconnue'),'error');
  } catch(e) { showToast('Erreur de connexion','error'); }
}

// ── Toast ──────────────────────────────────────────────────────────
function showToast(msg,type='') {
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast'+(type?' '+type:''); t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
